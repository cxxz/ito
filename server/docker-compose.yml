services:
  ito-grpc-server:
    build: .
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:$PORT:$PORT'
    env_file:
      - ./.env
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run start
    container_name: ito-server
    restart: always
    # Linux Docker doesn't define host.docker.internal by default; map it to the host
    # so the server can reach host-side services (e.g. vLLM on :8989).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_started
    environment:
      NODE_ENV: development
      DB_HOST: db

  db:
    image: postgres:17
    container_name: ito-postgres
    restart: always
    environment:
      POSTGRES_USER: '$DB_USER'
      POSTGRES_PASSWORD: '$DB_PASS'
      POSTGRES_DB: '$DB_NAME'
    ports:
      - '127.0.0.1:$DB_PORT:$DB_PORT'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
